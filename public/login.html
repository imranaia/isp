<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Independent Structure Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/img/isp-logo.svg" type="image/svg+xml">
  <script src="/js/isp-logo.js"></script>
  <style>
    :root {
      --green-950: #03140d; --green-900: #062016; --green-800: #0a3322; --green-500: #138a55;
      --gold: #d9ab3f; --gold-soft: #f0d58c; --muted: #a9b9b0; --line: rgba(240, 213, 140, 0.2);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      background: var(--green-950);
      color: #fff;
      font-family: "Manrope", system-ui, sans-serif;
    }
    .side {
      position: relative;
      overflow: hidden;
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        linear-gradient(180deg, rgba(3, 20, 13, 0.2), rgba(3, 20, 13, 0.92)),
        url("/img/haske-1.jpg") center top / cover;
    }
    .side a { color: var(--gold-soft); text-decoration: none; font-weight: 600; }
    .side h1 { font-family: "Fraunces", serif; font-size: clamp(40px, 4.6vw, 64px); line-height: 1; margin: 0 0 12px; }
    .side h1 span { color: var(--gold); }
    .side p { color: rgba(255, 255, 255, 0.8); max-width: 40ch; margin: 0; }
    main { display: grid; place-items: center; padding: 32px 16px; }
    form { width: min(400px, 100%); }
    .isp-mark { width: 58px; height: 58px; display: block; margin-bottom: 16px; }
    .isp-mark svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 6px 14px rgba(217, 171, 63, 0.35)); }
    .brand { font-weight: 700; letter-spacing: 0.14em; font-size: 13px; color: var(--gold); text-transform: uppercase; margin: 0 0 10px; }
    h2 { font-family: "Fraunces", serif; font-size: 38px; margin: 0 0 8px; }
    .sub { color: var(--muted); margin: 0 0 32px; }
    label { display: block; font-weight: 600; font-size: 14px; margin: 18px 0 8px; }
    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
      font: 500 16px "Manrope", sans-serif;
    }
    input:focus { outline: 2px solid var(--gold); border-color: transparent; }
    button {
      width: 100%;
      margin-top: 28px;
      padding: 15px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--gold-soft), var(--gold));
      color: var(--green-950);
      font: 700 16px "Manrope", sans-serif;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .error { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: rgba(200, 50, 50, 0.15); color: #ffb4b4; }
    .back { display: inline-block; margin-top: 14px; padding: 10px 0; color: var(--muted); font-size: 14px; }
    [hidden] { display: none !important; }
    @media (max-width: 860px) {
      body { grid-template-columns: 1fr; }
      .side { min-height: 260px; padding: 28px 16px; }
    }
  </style>
</head>
<body>
  <aside class="side">
    <a href="/">← Back to campaign</a>
    <div>
      <h1>Haske <span>2027</span></h1>
      <p>Independent Structure Platform. Every local government, every ward, every polling unit.</p>
    </div>
  </aside>
  <main>
    <form id="form">
      <span class="isp-mark" id="ispMark"></span>
      <p class="brand">ISP · Independent Structure Platform</p>
      <h2>Sign in</h2>
      <p class="sub">For the super admin and campaign agents.</p>
      <label for="login">Login (phone number or email)</label>
      <input id="login" name="login" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit" id="submit">Sign in</button>
      <div class="error" id="error" role="alert" hidden></div>
      <a class="back" href="/">Not an agent? Go back to the campaign page.</a>
    </form>
  </main>
  <script>
    document.getElementById("ispMark").innerHTML = window.ispLogoSVG ? window.ispLogoSVG("login") : "";
    fetch("/api/me").then((r) => { if (r.ok) location.replace("/dashboard"); });
    if (new URLSearchParams(location.search).has("expired")) {
      const notice = document.getElementById("error");
      notice.textContent = "You were signed out after 10 minutes without activity. Please sign in again.";
      notice.hidden = false;
    }

    const form = document.getElementById("form");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const button = document.getElementById("submit");
      const error = document.getElementById("error");
      error.hidden = true;
      button.disabled = true;
      button.textContent = "Signing in…";
      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ login: form.login.value, password: form.password.value }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Could not sign in.");
        location.replace("/dashboard");
      } catch (err) {
        error.textContent = err.message === "Failed to fetch" ? "Could not reach the server." : err.message;
        error.hidden = false;
      } finally {
        button.disabled = false;
        button.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
